name: urgences_medicales
description: "Application de gestion des urgences médicales — module E2 SOS et historique."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # État et navigation
  flutter_riverpod: ^3.0.0
  go_router: ^17.5.0
  # Réseau et stockage sécurisé du jeton (jamais dans SharedPreferences)
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  # Localisation et carte
  geolocator: ^14.0.1
  permission_handler: ^12.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # Dates en français, icônes fines
  intl: any
  phosphor_flutter: ^2.1.0
  url_launcher: 6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: any

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: BricolageGrotesque
      fonts:
        - { asset: assets/fonts/BricolageGrotesque-Regular.ttf, weight: 400 }
        - { asset: assets/fonts/BricolageGrotesque-Medium.ttf, weight: 500 }
        - { asset: assets/fonts/BricolageGrotesque-SemiBold.ttf, weight: 600 }
    - family: InstrumentSans
      fonts:
        - { asset: assets/fonts/InstrumentSans-Regular.ttf, weight: 400 }
        - { asset: assets/fonts/InstrumentSans-Medium.ttf, weight: 500 }
        - { asset: assets/fonts/InstrumentSans-SemiBold.ttf, weight: 600 }
